server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: qualquer rota cai no index.html (React Router cuida do resto).
  # index.html NUNCA fica em cache (30/10: depois de um deploy o navegador
  # seguia mostrando a versão antiga — index antigo + assets antigos imutáveis
  # em cache, tela inteira velha e funcionando). Só os assets com hash cacheiam.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
  }

  # Cache dos assets com hash no nome.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
