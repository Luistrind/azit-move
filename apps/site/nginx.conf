# Site institucional (azitmove.com.br). Página estática, sem backend.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # www.azitmove.com.br → azitmove.com.br (um endereço só para buscadores e para a Meta).
  if ($http_host ~* ^www\.(.+)$) { return 301 https://$1$request_uri; }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  location = /index.html { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options DENY always; }
  location ~* \.(png|jpg|jpeg|webp|svg|ico)$ { expires 30d; access_log off; }
  # Caminho que não existe volta para a página principal (página única).
  location / { try_files $uri $uri/ /index.html; }
}
